name: Build updates.json

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Build updates.json from repo commits
        env:
          OWNER: SilentTearsDev
          # Put the repos you want to track here (public + private)
          REPOS: '["Studio_Web_Page","Python","NEXA","Silent_Tears", "Knight-Joe"]'

          # Use GH_PAT if you set it (needed for private repos).
          # If not set, it falls back to GITHUB_TOKEN (good mostly for public).
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, urllib.error

          owner = os.environ["OWNER"]
          repos = json.loads(os.environ["REPOS"])
          token = os.environ.get("GH_TOKEN", "")

          def get(url):
            req = urllib.request.Request(url)
            req.add_header("Accept", "application/vnd.github+json")
            if token:
              req.add_header("Authorization", f"Bearer {token}")
            try:
              with urllib.request.urlopen(req) as r:
                return json.loads(r.read().decode("utf-8")), r.status
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              return {"_error": True, "status": e.code, "body": body}, e.code

          updates = []
          errors = []

          for repo in repos:
            url = f"https://api.github.com/repos/{owner}/{repo}/commits?per_page=1"
            data, status = get(url)

            if isinstance(data, dict) and data.get("_error"):
              errors.append({
                "repo": repo,
                "status": status,
                "detail": data.get("body", "")[:300]
              })
              print(f"[FAIL] {repo} -> HTTP {status}")
              continue

            if not data:
              print(f"[SKIP] {repo} -> no commits returned")
              continue

            c = data[0]
            msg = c["commit"]["message"].splitlines()[0]
            date = c["commit"]["author"]["date"][:10]
            html = c["html_url"]

            updates.append({"repo": repo, "date": date, "title": msg, "url": html})
            print(f"[OK] {repo} -> {date} -> {msg}")

          updates.sort(key=lambda x: x["date"], reverse=True)

          out = {
            "owner": owner,
            "generated": True,
            "updates": updates,
            "errors": errors
          }

          with open("updates.json", "w", encoding="utf-8") as f:
            json.dump(out, f, ensure_ascii=False, indent=2)

          print("---- SUMMARY ----")
          print("updates:", len(updates))
          print("errors:", len(errors))
          PY

      - name: Commit updates.json (only if changed)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "Update updates.json"
          git push

