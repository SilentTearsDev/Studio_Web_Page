name: Build updates.json

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Build updates.json from repo commits
        env:
          OWNER: SilentTearsDev
          # Put the repos you want to track here (public + private)
          REPOS: '["Studio_Web_Page","Python","NEXA","Silent_Tears"]'

          # Use GH_PAT if you set it (needed for private repos).
          # If not set, it falls back to GITHUB_TOKEN (good mostly for public).
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request

          owner = os.environ["OWNER"]
          repos = json.loads(os.environ["REPOS"])
          token = os.environ.get("GH_TOKEN", "")

          def get(url):
            req = urllib.request.Request(url)
            req.add_header("Accept", "application/vnd.github+json")
            if token:
              req.add_header("Authorization", f"Bearer {token}")
            with urllib.request.urlopen(req) as r:
              return json.loads(r.read().decode("utf-8"))

          updates = []
          for repo in repos:
            # latest commit (default branch)
            commits = get(f"https://api.github.com/repos/{owner}/{repo}/commits?per_page=1")
            if not commits:
              continue
            c = commits[0]
            msg = c["commit"]["message"].splitlines()[0]
            date = c["commit"]["author"]["date"][:10]
            url = c["html_url"]

            updates.append({
              "repo": repo,
              "date": date,
              "title": msg,
              "url": url
            })

          # newest first
          updates.sort(key=lambda x: x["date"], reverse=True)

          out = {"owner": owner, "generated": True, "updates": updates}
          with open("updates.json", "w", encoding="utf-8") as f:
            json.dump(out, f, ensure_ascii=False, indent=2)

          print("Wrote updates.json with", len(updates), "items")
          PY

      - name: Commit updates.json (only if changed)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "Update updates.json"
          git push
